# ============================================
# 开发环境配置
# ============================================

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog_forum?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池优化配置
    hikari:
      maximum-pool-size: 30
      minimum-idle: 8
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: BlogHikariPool

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:3}
      timeout: 10000ms
      connect-timeout: 10000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 10000ms
        shutdown-timeout: 5000ms

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    sender-name: ${MAIL_SENDER_NAME:哈基聪}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  # MyBatis Plus 开发环境日志
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # JWT 密钥（开发环境）
  secret: ${JWT_SECRET:dev-secret-key-for-testing-only-please-change-me-1234567890}

# ============================================
# 文件存储配置
# ============================================
storage:
  # 存储类型：minio 或 oss（开发环境默认使用minio）
  type: ${STORAGE_TYPE:minio}
  init-fail-fast: false

minio:
  # MinIO 配置（本地）
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:blog}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET:iblog-forum}
    custom-domain: ${ALIYUN_OSS_CUSTOM_DOMAIN:}

amap:
  # 高德地图 API
  key: ${AMAP_KEY:}

zhipu:
  # 智谱AI配置
  api-key: ${ZHIPU_API_KEY:}

oauth:
  # OAuth配置（本地回调地址）
  frontend-redirect-base: ${OAUTH_FRONTEND_REDIRECT_BASE:http://localhost:5173}
  github:
    client-id: ${OAUTH_GITHUB_CLIENT_ID:}
    client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}
    redirect-uri: ${OAUTH_GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
  gitee:
    client-id: ${OAUTH_GITEE_CLIENT_ID:}
    client-secret: ${OAUTH_GITEE_CLIENT_SECRET:}
    redirect-uri: ${OAUTH_GITEE_REDIRECT_URI:http://localhost:8080/api/auth/gitee/callback}

captcha:
  expire-seconds: ${CAPTCHA_EXPIRE_SECONDS:300}
