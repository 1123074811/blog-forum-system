# ============================================
# 主配置文件 - 公共配置
# ============================================
spring:
  profiles:
    active: dev  # 默认激活开发环境，生产环境通过启动参数指定

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.blog.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  expiration: 86400000        # 24小时
  refresh-expiration: 604800000  # 7天

# 文件上传配置
file:
  upload-dir: uploads
  max-size: 104857600  # 100MB

# 天气配置
weather:
  default-city: 乌鲁木齐

amap:
  weather:
    extensions: base
