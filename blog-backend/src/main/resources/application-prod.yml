# ============================================
# 生产环境配置
# ============================================
# 使用环境变量来配置敏感信息，提高安全性
# 启动命令示例：
# java -jar app.jar --spring.profiles.active=prod
# 或通过环境变量：export SPRING_PROFILES_ACTIVE=prod
# ============================================

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog_forum?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:3}
      timeout: 10000ms
      connect-timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms
        shutdown-timeout: 5000ms

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatis Plus 生产环境配置（关闭SQL日志）
mybatis-plus:
  configuration:
    log-impl: ~  # 生产环境不打印SQL

# JWT 密钥���生产环境必须使用强密钥）
jwt:
  secret: ${JWT_SECRET}  # 必须通过环境变量设置

# MinIO 配置（生产环境）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:blog}

# ============================================
# 文件存储配置
# ============================================
# 存储类型：minio 或 oss
storage:
  type: ${STORAGE_TYPE:oss}

# 阿里云OSS配置（当 storage.type=oss 时使用）
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIYUN_OSS_BUCKET:iblog-forum}
    custom-domain: ${ALIYUN_OSS_CUSTOM_DOMAIN:}

# 高德地图 API
amap:
  key: ${AMAP_KEY}

# 智谱AI配置
zhipu:
  api-key: ${ZHIPU_API_KEY}

# OAuth配置（生产环境回调地址）
oauth:
  github:
    client-id: ${OAUTH_GITHUB_CLIENT_ID}
    client-secret: ${OAUTH_GITHUB_CLIENT_SECRET}
    redirect-uri: ${OAUTH_GITHUB_REDIRECT_URI:https://yourdomain.com/api/auth/github/callback}
  gitee:
    client-id: ${OAUTH_GITEE_CLIENT_ID}
    client-secret: ${OAUTH_GITEE_CLIENT_SECRET}
    redirect-uri: ${OAUTH_GITEE_REDIRECT_URI:https://yourdomain.com/api/auth/gitee/callback}

captcha:
  expire-seconds: ${CAPTCHA_EXPIRE_SECONDS:300}
